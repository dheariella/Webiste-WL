# Menerbitkan website ke GitHub Pages.
#
# GitHub Pages di repositori ini memakai sumber "Deploy from a branch"
# dengan branch gh-pages, yang menyala sendiri saat branch itu pertama
# kali dibuat. Alur kerja ini menjaga branch gh-pages tetap sama dengan
# branch kerja, sehingga setiap perubahan langsung tayang.
#
# Cara ini dipakai karena menyalakan Pages lewat actions/configure-pages
# ditolak GitHub: token bawaan GitHub Actions tidak berwenang membuat
# situs Pages baru.
name: Terbitkan website

on:
  push:
    branches: [claude/nice-davinci-ctimc1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terbitkan
  cancel-in-progress: false

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil berkas
        uses: actions/checkout@v4

      - name: Salin ke branch gh-pages
        run: |
          set -e
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git add -A
          git commit -m "Terbitkan ${GITHUB_SHA::7}" || echo "Tidak ada perubahan untuk diterbitkan."
          git push --force origin gh-pages

      - name: Alamat website
        run: |
          echo "### Website sudah diperbarui" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Beranda: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_STEP_SUMMARY
          echo "- Editor: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/editor.html" >> $GITHUB_STEP_SUMMARY
