# Menerbitkan website ke GitHub Pages setiap kali ada perubahan.
#
# Langkah configure-pages dijalankan dengan enablement: true sehingga
# alur kerja ini menyalakan GitHub Pages sendiri bila belum menyala.
#
# Catatan: pada akun GitHub Free, Pages hanya tersedia untuk repositori
# publik. Selama repositori masih privat, penyalaan itu ditolak GitHub
# dengan pesan "Resource not accessible by integration".
name: Terbitkan website

on:
  push:
    branches: [claude/nice-davinci-ctimc1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.terbit.outputs.page_url }}
    steps:
      - name: Ambil berkas
        uses: actions/checkout@v4

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Kemas seluruh isi folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Terbitkan
        id: terbit
        uses: actions/deploy-pages@v4
