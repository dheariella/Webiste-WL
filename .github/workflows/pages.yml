# Menerbitkan website ke GitHub Pages setiap kali ada perubahan.
#
# Sebelum ini bisa berjalan, GitHub Pages harus dinyalakan sekali secara
# manual: Settings > Pages > Source > pilih "GitHub Actions".
# Menyalakannya dari dalam alur kerja tidak bisa dilakukan, karena token
# bawaan GitHub Actions tidak berwenang membuat situs Pages baru.
#
# Catatan: pada akun GitHub Free, Pages hanya tersedia untuk repositori
# publik. Repositori privat memerlukan GitHub Pro.
name: Terbitkan website

on:
  push:
    branches: [claude/nice-davinci-ctimc1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.terbit.outputs.page_url }}
    steps:
      - name: Ambil berkas
        uses: actions/checkout@v4

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Kemas seluruh isi folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Terbitkan
        id: terbit
        uses: actions/deploy-pages@v4
